spring:
  application:
    name: coupon
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3388/coupon}
    username: ${SPRING_DATASOURCE_USERNAME:coupon}
    password: ${SPRING_DATASOURCE_PASSWORD:coupon}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

coupon:
  cache:
    ttl-ms: ${COUPON_CACHE_TTL_MS:1000}
    simulated-load-latency-ms: ${COUPON_CACHE_SIMULATED_LOAD_LATENCY_MS:50}
    fresh-ms: ${COUPON_CACHE_FRESH_MS:500}
  sold-out:
    # 매진 플래그 Redis TTL (이벤트 종료까지 유지). 하루.
    ttl-seconds: ${COUPON_SOLD_OUT_TTL_SECONDS:86400}
    # Application fast-path (Caffeine) TTL. 매진 직후 이 시간만큼 실제 매진을 아직 모를 수 있음.
    fast-path-ttl-ms: ${COUPON_SOLD_OUT_FAST_PATH_TTL_MS:1000}

logging:
  level:
    com.mingdy.coupon: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
