services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coupon
      MYSQL_USER: coupon
      MYSQL_PASSWORD: coupon
    ports:
      - "3388:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.0
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    # KRaft 모드: 예전엔 클러스터 정보(메타데이터) 관리를 ZooKeeper 라는 별도 서버가 했지만,
    # 지금은 카프카가 직접 한다. 그래서 ZooKeeper 컨테이너가 필요 없다.
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      # 이 서버 1대가 브로커(메시지 저장)와 컨트롤러(메타데이터 관리) 역할을 둘 다 한다.
      KAFKA_PROCESS_ROLES: broker,controller
      # 열어둘 포트 3개(리스너). 접속하는 위치에 따라 주소가 달라서 나눠둔다.
      # - PLAINTEXT 9092: 도커 네트워크 안(coupon-service 컨테이너)에서 접속
      # - CONTROLLER 9093: 컨트롤러끼리 통신용
      # - HOST 9094: 내 맥(로컬에서 bootRun)에서 접속
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      # 클라이언트가 처음 접속하면 브로커가 "앞으로는 이 주소로 접속해"라고 알려주는 주소.
      # 컨테이너 안에서는 kafka:9092, 맥에서는 localhost:9094 로 알려줘야 둘 다 접속된다.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 리스너 이름별 보안 방식. 로컬 학습용이라 전부 암호화·인증 없음(PLAINTEXT).
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 토픽이 자동 생성될 때의 기본 파티션 수
      KAFKA_NUM_PARTITIONS: 3
      # 카프카 내부 토픽(오프셋 저장 등)의 복제본 수. 기본값 3이지만 브로커가 1대라 1로 낮춘다.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 없는 토픽에 메시지를 보내면 자동으로 만든다. (토픽은 KafkaTopicConfig 가 미리 만들어둠)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9094"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092" ]
      interval: 10s
      timeout: 5s
      retries: 20

  coupon-service:
    image: coupon-service:latest
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/coupon
      SPRING_DATASOURCE_USERNAME: coupon
      SPRING_DATASOURCE_PASSWORD: coupon
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"

volumes:
  mysql-data:
  redis-data:
